regras:
- id: R001
  contexto: regulamentar
  autoridade: IHF
  fonte_id: SRC-001
  referencia_normativa: Regra 9:6
  localizador: p. 22
  vigencia: '2026-04-01'
  titulo: Pontuação de dois pontos para gol marcado pelo goleiro
  descricao: Concede 2 pontos quando um gol válido é marcado pelo atleta que está
    formalmente vestido e exercendo a função regulamentar de goleiro no momento
    do arremesso.
  conceitos_relacionados:
  - C017
  - C018
  - C019
  condicoes_fato:
    gol_valido: SIM
    funcao_regulamentar_goleiro_em_exercicio: SIM
  resultado_se_condicoes_atendidas:
    aplicacao: APLICAVEL
    pontos_atribuidos: 2
    sinal_arbitral_obrigatorio: Sinal 11.2 (dois pontos)
  resultado_se_fato_indeterminado:
    aplicacao: INCONCLUSIVA
    acao: Requer comprovação de que o arremessador exercia formalmente a função regulamentar
      de goleiro (camisa/registro).
    pontos_atribuidos: null
  excecoes:
  - Se o gol for marcado por jogador de linha sem função comprovada de goleiro, atribui-se
    apenas 1 ponto (a menos que seja gol espetacular/6m).
  - A simples designação tática de "especialista" (C024) não aciona R001 sem a comprovação
    da função de goleiro em exercício.
  nota_arbitragem: A decisão dos árbitros em quadra sobre a validade do gol e a pontuação
    é final (Regra 17:13).
  resultado_se_condicoes_rejeitadas:
    aplicacao: NAO_APLICAVEL
    pontos_atribuidos: null
    motivo: Condições da regra R001 não foram satisfeitas.
- id: R002
  contexto: regulamentar
  autoridade: IHF
  fonte_id: SRC-001
  referencia_normativa: Regra 9:2 e Clarificação 1
  localizador: pp. 21, 46-47
  vigencia: '2026-04-01'
  titulo: Pontuação de dois pontos para gol espetacular ou criativo
  descricao: Gols espetaculares ou criativos são bonificados com 2 pontos. A apreciação
    do caráter espetacular é competência exclusiva dos árbitros em quadra.
  conceitos_relacionados:
  - C003
  - C006
  - C013
  - C014
  - C018
  - C019
  - C021
  sub_regras:
  - modalidade: in_flight
    condicoes:
      gol_valido: SIM
      arremessador_suspenso_no_ar: SIM
      controle_da_bola_no_ar: SIM
      arremesso_executado_antes_da_queda: SIM
    pontos: 2
    excecao: Dar um tapa (slap) ou empurrão momentâneo na bola sem controle prévio
      resulta em gol simples de 1 ponto (Clarificação 1).
  - modalidade: spin_shot
    condicoes:
      gol_valido: SIM
      rotacao_corporal_completa_no_ar_360: SIM
      apreciacao_arbitral_alto_padrao_tecnico: SIM
    pontos: 2
    excecao: Giro incompleto, aterrissagem antes da soltura da bola ou ausência de
      reconhecimento arbitral de plasticidade concede apenas 1 ponto.
  resultado_se_fato_indeterminado:
    aplicacao: INCONCLUSIVA
    pontos_atribuidos: null
    motivo: A avaliação de plasticidade e regularidade técnica depende da observação
      visual completa e da decisão dos árbitros.
  condicoes_fato:
    gol_valido: SIM
    carater_criativo_ou_espetacular_reconhecido: SIM
  resultado_se_condicoes_atendidas:
    aplicacao: APLICAVEL
    pontos_atribuidos: 2
    sinal_arbitral_obrigatorio: Sinal 11.2 (dois pontos com balanço vertical de braço)
  resultado_se_condicoes_rejeitadas:
    aplicacao: NAO_APLICAVEL
    pontos_atribuidos: 1
    motivo: Se o gol for regular mas não atender aos requisitos de plasticidade/controle
      da Clarificação 1, vale 1 ponto.
- id: R003
  contexto: regulamentar
  autoridade: IHF
  fonte_id: SRC-001
  referencia_normativa: Regra 9:3 e Regra 14:4
  localizador: pp. 22, 27-28
  vigencia: '2026-04-01'
  titulo: Pontuação de dois pontos para gol em tiro de 6 metros
  descricao: Um gol convertido a partir de uma cobrança formal de tiro de 6 metros
    concede 2 pontos à equipe arremessadora.
  conceitos_relacionados:
  - C018
  - C019
  - C020
  condicoes_fato:
    gol_valido: SIM
    origem_lance: tiro_de_6_metros
  resultado_se_condicoes_atendidas:
    aplicacao: APLICAVEL
    pontos_atribuidos: 2
  excecoes:
  - Se houver invasão antecipada da linha de 6 metros pelo arremessador antes da soltura
    da bola, o gol é anulado e assinala-se tiro livre para a defesa (Regra 14:5).
  resultado_se_condicoes_rejeitadas:
    aplicacao: NAO_APLICAVEL
    pontos_atribuidos: null
    motivo: Condições da regra R003 não foram satisfeitas.
  resultado_se_fato_indeterminado:
    aplicacao: INCONCLUSIVA
    pontos_atribuidos: null
    motivo: Fatos necessários para a regra R003 estão indeterminados.
- id: R004
  contexto: regulamentar
  autoridade: IHF
  fonte_id: SRC-001
  referencia_normativa: Regra 9:1
  localizador: p. 21; Glossary p. 65
  vigencia: '2026-04-01'
  titulo: Pontuação de gol contra
  descricao: Quando um jogador coloca a bola diretamente dentro de sua própria meta,
    o gol é validado e concede invariavelmente 1 ponto à equipe oponente.
  conceitos_relacionados:
  - C007
  - C018
  condicoes_fato:
    bola_cruza_linha_de_gol: SIM
    ultimo_toque_jogador_propria_equipe: SIM
  resultado_se_condicoes_atendidas:
    aplicacao: APLICAVEL
    pontos_atribuidos: 1
    beneficiario: equipe_adversaria
  excecoes:
  - Tiro de meta executado pelo goleiro que entra na própria meta sem antes ultrapassar
    a linha de 6 metros não é gol; o tiro de meta é simplesmente repetido (Regra 12:2).
  resultado_se_condicoes_rejeitadas:
