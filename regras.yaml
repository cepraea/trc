  autoridade: IHF
  fonte_id: SRC-001
  referencia_normativa: Regra 9:8-10
  localizador: pp. 22-24
  vigencia: '2026-04-01'
  titulo: Procedimento de desempate por Shoot-out
  descricao: Se cada equipe vencer um período (1-1), a partida é decidida em disputa
    de Shoot-out com 5 tentativas alternadas por equipe.
  conceitos_relacionados:
  - C008
  - C017
  - C018
  - C019
  condicoes_fato:
    sets_empatados_em_1_a_1: SIM
  resultado_se_condicoes_atendidas:
    aplicacao: APLICAVEL
    regras_especificas:
    - Goleiros iniciam na linha de gol.
    - Jogador passa a bola de volta ao seu goleiro e corre em direção a meta adversária.
    - A bola nao pode tocar a areia apos o passe de saida do goleiro.
    - Gols simples concedem 1 ponto; gols criativos/goleiro concedem 2 pontos no placar
      do shoot-out.
  resultado_se_condicoes_rejeitadas:
    aplicacao: NAO_APLICAVEL
    pontos_atribuidos: null
    motivo: Condições da regra R007 não foram satisfeitas.
  resultado_se_fato_indeterminado:
    aplicacao: INCONCLUSIVA
    pontos_atribuidos: null
    motivo: Fatos necessários para a regra R007 estão indeterminados.
