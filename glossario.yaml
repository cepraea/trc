    área não é exclusivo e pode ser disputado (6:5).
  criterios_delimitacao:
    inclusao:
    - Superfície retangular delimitada pela linha de fundo e pela linha de 6 metros,
      incluindo as balizas
    exclusao:
    - Área de jogo central de 15x12 metros onde atuam os jogadores de linha
