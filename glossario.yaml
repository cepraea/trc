  regras:
  - R014
  - R016
  relacoes:
  - tipo: relacionado_a
    destino_id: C017
    justificativa: Espaço exclusivo onde o goleiro pode defender sem restrições de
      passos (Regra 5).
  - tipo: regulado_por
    destino_id: R014
    justificativa: Regra 6 disciplinam os direitos exclusivos e invasões na área de
      gol.
  - tipo: regulado_por
    destino_id: R016
    justificativa: Regra 12 disciplina a execução do tiro de meta de dentro da área.
  exemplos:
  - tipo: REAL
    descricao: Superfície de areia de 6x12 metros na qual apenas o goleiro da equipe
      defensora pode permanecer com apoio no solo.
  - tipo: CONTRAEXEMPLO_SIMULADO
    descricao: Jogador de linha defensor pisa voluntariamente na areia dentro dos
      6 metros para bloquear atacante (falta, tiro de 6m).
- id: C023
  contexto: regulamentar
  classe: espaco_operacional
  tipo_ontologico: espaco_fisico
  termos:
    pt_BR:
      preferido: Área de substituição
      natureza: traducao_adotada
      alternativos:
      - Zona de substituição
      - Substitution area
    en:
      preferido: Substitution area
      natureza: termo_normativo_IHF
  definicao: Área de 15x3 metros situada ao longo das linhas laterais do campo de
    jogo destinada aos atletas reservas e oficiais devidamente inscritos.
  origem:
    tipo: regra_oficial
    referencias:
    - fonte_id: SRC-001
      localizador: Regras 1:6, 4:13–14, pp. 4, 14; Anexo p. 58
  limites: As entradas de jogadores de linha e do goleiro devem ser efetuadas obrigatoriamente
    sobre o respectivo segmento da linha lateral da equipe.
  criterios_delimitacao:
    inclusao:
    - Faixa lateral de 15x3 metros contígua à linha lateral em frente ao respectivo
      banco de reservas da equipe
    exclusao:
    - Área técnica restrita de dirigentes ou zona de substituição da equipe adversária
  estado_de_verificacao: SUSTENTADO_INTEGRALMENTE
  regras:
  - R013
  relacoes:
  - tipo: relacionado_a
    destino_id: C024
    justificativa: Área por onde o especialista e o goleiro realizam as substituições
      rápidas de transição.
  - tipo: regulado_por
    destino_id: R013
    justificativa: Regras 4:13-14 e Anexo disciplinam as substituições na área designada.
  exemplos:
  - tipo: REAL
    descricao: Atleta sai da quadra cruzando a linha lateral de sua área e somente
      após sua saída o companheiro entra na areia.
  - tipo: CONTRAEXEMPLO_SIMULADO
    descricao: Atleta reserva entra na quadra pulando pela linha de fundo atrás do
      gol (substituição irregular, suspensão individual).
- id: C024
  contexto: tatica
  classe: papel_tatico
  tipo_ontologico: papel_funcional
  termos:
    pt_BR:
      preferido: Especialista
      natureza: convencao_interna
      alternativos:
      - Atleta especialista
      - Coringa ofensivo
    en:
      preferido: Specialist
      natureza: termo_tecnico_adotado
  definicao: Papel tático de ataque atribuído discricionariamente pelo técnico a qualquer
    atleta de linha para atuar livre em qualquer posto (central, lateral ou pivô)
    vestindo a camisa de goleiro.
  origem:
    tipo: definicao_especialista
    referencias:
    - fonte_id: SRC-007
      localizador: Decisão da comissão técnica / autoridade do treinador
  limites: Não é verbete oficial da IHF. Gol marcado pelo especialista só vale 2 pontos
    se o atleta estiver formalmente no exercício da função regulamentar de goleiro.
  criterios_delimitacao:
    inclusao:
    - Atleta de linha escolhido pelo técnico para atuar com a camisa de goleiro em
      qualquer posição de ataque
    exclusao:
    - Goleiro defensivo fixo
    - Jogador de linha em trajes comuns atuando no ataque
  estado_de_verificacao: SUSTENTADO_INTEGRALMENTE
  regras:
  - R001
  relacoes:
  - tipo: executado_por
    destino_id: C017
    justificativa: O especialista assume formalmente e operacionaliza a função de
      goleiro no momento em que atua no ataque.
  - tipo: diferente_de
    destino_id: C017
    justificativa: Papel tático de comissão técnica não se confunde ontologicamente
      com a função regulamentar internacional.
  - tipo: relacionado_a
    destino_id: C019
    justificativa: Se marcar gol investido regularmente da camisa de goleiro, aciona
      a pontuação de 2 pontos da Regra 9:6.
  - tipo: regulado_por
    destino_id: R001
    justificativa: Regra 9:6 disciplina a pontuação de 2 pontos para gols de goleiro
      e a alternância de funções.
  exemplos:
  - tipo: REAL
    descricao: Treinador determina que a ponta-esquerda vista a camisa de goleiro
      para jogar como quarta atacante e criar superioridade numérica.
  - tipo: CONTRAEXEMPLO_SIMULADO
    descricao: Atleta entra no ataque vestindo o colete comum de linha e a equipe
      clama por 2 pontos ao marcar gol regular de apoio.
- id: C025
  contexto: regulamentar
  classe: infracao_tatico_normativa
  tipo_ontologico: evento_infracao
  termos:
    pt_BR:
      preferido: Jogo passivo
      natureza: traducao_adotada
      alternativos:
      - Ataque passivo
      - Passive Play
    en:
      preferido: Passive Play
      natureza: termo_normativo_IHF
  definicao: Infração cometida ao manter a posse de bola sem tentativa reconhecível
    de progressão ou arremesso à meta, penalizada com tiro livre contra a equipe.
  origem:
    tipo: regra_oficial
    referencias:
    - fonte_id: SRC-001
      localizador: Regra 7:10–11, p. 18; Clarificação 4, pp. 48–54; Sinal 16
  limites: Após o gesto de pré-aviso (Sinal 16), a equipe tem o limite taxativo de
    4 passes para finalizar a gol.
  criterios_delimitacao:
    inclusao:
    - Manter a posse de bola deliberadamente sem demonstrar iniciativa evidente de
      progresso ou arremesso à meta
    exclusao:
    - Troca de passes sob pressão defensiva ativa buscando brechas reais na linha
      de marcação
  estado_de_verificacao: SUSTENTADO_INTEGRALMENTE
  regras:
  - R009
  relacoes:
  - tipo: relacionado_a
    destino_id: C010
    justificativa: A infração consumada de jogo passivo acarreta tiro livre para a
      defesa e consequente turnover.
  - tipo: regulado_por
    destino_id: R009
    justificativa: Regra 7:10-11 e Clarificação 4 disciplinam o jogo passivo com teto
      de 4 passes.
  exemplos:
  - tipo: REAL
    descricao: Árbitros erguem o braço de pré-aviso; a equipe executa 4 passes sem
      arremessar; no 5º passe os árbitros apitam jogo passivo.
  - tipo: CONTRAEXEMPLO_SIMULADO
    descricao: Equipe troca 2 passes após o sinal de pré-aviso e executa arremesso
      direto ao gol (lance regular).
- id: C026
  contexto: regulamentar
  classe: procedimento_disciplinar_especial
  tipo_ontologico: procedimento_normativo
  termos:
    pt_BR:
      preferido: Regra dos últimos 15 segundos
      natureza: traducao_adotada
      alternativos:
      - Últimos 15 segundos
      - Last 15 seconds
    en:
      preferido: Last 15 seconds rule
      natureza: termo_normativo_IHF
  definicao: Dispositivo sancionador que pune infrações intencionais cometidas nos
    últimos 15 segundos de um período ou durante o Gol de Ouro com desqualificação
    direta e tiro de 6 metros.
  origem:
    tipo: regra_oficial
    referencias:
    - fonte_id: SRC-001
      localizador: Regra 8:11, p. 21; Clarificação 10, pp. 56–57
  limites: Aplica-se especificamente a condutas de atraso, desrespeito de distância
    ou impedimento de execução de tiros para frustrar clara chance de gol.
  criterios_delimitacao:
    inclusao:
    - Ato antidesportivo de impedir ou atrasar a cobrança de um tiro adversário nos
      últimos 15 segundos do período ou no Golden Goal
    exclusao:
    - Falta comum de jogo com tempo regular superior a 15 segundos decorrido
  estado_de_verificacao: SUSTENTADO_INTEGRALMENTE
  regras:
  - R005
  relacoes:
  - tipo: relacionado_a
    destino_id: C028
    justificativa: Aciona desqualificação imediata do infrator.
  - tipo: regulado_por
    destino_id: R005
    justificativa: Regra 8:11 e Clarificação 10 disciplinam as sanções e tiros nos
      últimos 15 segundos ou Golden Goal.
  exemplos:
  - tipo: REAL
    descricao: A 8 segundos do fim, defensor bloqueia a bola antes da distância de
      1 metro no tiro livre; árbitros mostram cartão vermelho direto e dão tiro de
      6m.
  - tipo: CONTRAEXEMPLO_SIMULADO
    descricao: Falta similar ocorrida no 5º minuto do primeiro período (apenas tiro
      livre e suspensão progressiva comum).
- id: C027
  contexto: regulamentar
  classe: sancao_disciplinar
  tipo_ontologico: sancao_disciplinar
  termos:
    pt_BR:
      preferido: Suspensão
      natureza: traducao_adotada
      alternativos:
      - Exclusão temporária
      - Suspension
    en:
      preferido: Suspension
      natureza: termo_normativo_IHF
  definicao: Sanção disciplinar individual aplicada por faltas repetidas ou antidesportivas,
    obrigando o atleta a deixar a quadra até que ocorra um turnover de posse.
  origem:
    tipo: regra_oficial
    referencias:
    - fonte_id: SRC-001
      localizador: Regra 16:1–5, pp. 29–31; Sinal 12, p. 43
  limites: A segunda suspensão aplicada ao mesmo atleta acarreta automaticamente sua
    desqualificação da partida (16:5).
  criterios_delimitacao:
    inclusao:
    - Penalidade disciplinar individual aplicada por infração grave; jogador sai de
      quadra e equipe atua em desvantagem até turnover
    exclusao:
    - Advertência verbal sem exclusão temporária
    - Desqualificação definitiva da partida
  estado_de_verificacao: SUSTENTADO_INTEGRALMENTE
  regras:
  - R010
  relacoes:
  - tipo: relacionado_a
    destino_id: C010
    justificativa: O turnover de posse de bola é a condição mandatória de liberação
      para recomposição da equipe.
  - tipo: regulado_por
    destino_id: R010
    justificativa: Regra 16:1-5 disciplina a suspensão e término por turnover da equipe.
  exemplos:
  - tipo: REAL
    descricao: Atleta comete falta por segurar adversário pela camisa; árbitro assinala
      Sinal 12; atleta aguarda fora até o turnover da equipe.
  - tipo: CONTRAEXEMPLO_SIMULADO
    descricao: Atleta comete falta comum leve de bloqueio frontal com as mãos abertas
      (apenas tiro livre ordinário).
- id: C028
  contexto: regulamentar
  classe: sancao_disciplinar
  tipo_ontologico: sancao_disciplinar
  termos:
    pt_BR:
      preferido: Desqualificação
      natureza: traducao_adotada
      alternativos:
      - Cartão vermelho
      - Disqualification
    en:
      preferido: Disqualification
      natureza: termo_normativo_IHF
  definicao: Sanção disciplinar máxima assinalada por cartão vermelho que exclui definitivamente
    o atleta ou oficial da partida por conduta antidesportiva grave ou agressão.
  origem:
    tipo: regra_oficial
    referencias:
    - fonte_id: SRC-001
      localizador: Regra 16:6–10, pp. 31–32; Sinal 13, p. 44
  limites: A equipe joga com um atleta a menos até a ocorrência do próximo turnover,
    quando pode recompor seu efetivo em quadra.
  criterios_delimitacao:
    inclusao:
    - Exclusão definitiva da partida formalizada por cartão vermelho por falta violenta,
      2ª suspensão ou agressão
    exclusao:
    - Suspensão temporária por 1 turnover de jogo
  estado_de_verificacao: SUSTENTADO_INTEGRALMENTE
  regras:
  - R005
  - R011
  relacoes:
  - tipo: relacionado_a
    destino_id: C027
    justificativa: A segunda suspensão do mesmo jogador acarreta desqualificação compulsória.
  - tipo: regulado_por
    destino_id: R005
    justificativa: Regra 8:11 e Clarificação 10 disciplinam as sanções e tiros nos
      últimos 15 segundos ou Golden Goal.
  - tipo: regulado_por
    destino_id: R011
    justificativa: Regra 16:6-10 disciplina a desqualificação direta com cartão vermelho.
  exemplos:
  - tipo: REAL
    descricao: Atleta atinge intencionalmente o rosto do arremessador no ar; árbitros
      exibem cartão vermelho direto.
  - tipo: CONTRAEXEMPLO_SIMULADO
    descricao: Atleta recebe a 1ª suspensão da partida e é orientado a aguardar no
      banco (segue elegível para o restante do jogo).
- id: C029
  contexto: regulamentar
  classe: reinicio_formal
  tipo_ontologico: procedimento_normativo
  termos:
    pt_BR:
      preferido: Tiro de árbitro
      natureza: traducao_adotada
      alternativos:
      - Bola ao alto
      - Referee throw
    en:
      preferido: Referee throw
      natureza: termo_normativo_IHF
  definicao: Arremesso vertical da bola executado pelo árbitro no centro da quadra
    para início dos períodos e do Gol de Ouro, disputado no ar por dois atletas.
  origem:
    tipo: regra_oficial
    referencias:
    - fonte_id: SRC-001
      localizador: Regras 2:2, 10:1–5, pp. 8, 24
  limites: A bola só pode ser tocada após atingir seu ponto mais alto. É proibido
    agarrar a bola diretamente no salto.
  criterios_delimitacao:
    inclusao:
    - Lançamento vertical da bola pelo árbitro no ponto central para início de cada
      período e do Golden Goal
    exclusao:
    - Tiro lateral ou tiro de meta de reinício ordinário de jogo
  estado_de_verificacao: SUSTENTADO_INTEGRALMENTE
  regras:
  - R006
  - R015
  relacoes:
  - tipo: ocorre_em
    destino_id: C022
    justificativa: Ocorre na linha imaginária central que divide a quadra entre as
      áreas de gol.
  - tipo: regulado_por
    destino_id: R006
    justificativa: Regras 2:6 e 9:7 disciplinam a decisão de períodos por Gol de Ouro.
  - tipo: regulado_por
    destino_id: R015
    justificativa: Regra 10 disciplina o tiro de árbitro no centro da quadra.
  exemplos:
  - tipo: REAL
    descricao: Árbitro apita e lança a bola para cima no centro da quadra; dois saltadores
      disputam a bola no ápice com um tapa para os companheiros.
  - tipo: CONTRAEXEMPLO_SIMULADO
    descricao: Atleta agarra a bola com ambas as mãos ainda no salto do tiro de árbitro
      (infração, tiro livre para o adversário).
- id: C030
  contexto: regulamentar
  classe: execucao_formal
  tipo_ontologico: procedimento_normativo
  termos:
    pt_BR:
      preferido: Tiro de meta
      natureza: traducao_adotada
      alternativos:
      - Tiro de goleiro
      - Goalkeeper throw
    en:
      preferido: Goalkeeper throw
      natureza: termo_normativo_IHF
  definicao: Lançamento executado pelo goleiro de dentro de sua área para além da
    linha de 6m após gol sofrido, bola na linha de fundo ou controle da bola na área.
  origem:
    tipo: regra_oficial
    referencias:
    - fonte_id: SRC-001
      localizador: Regra 12:1–3, p. 25; Sinal 8, p. 41
  limites: Executado sem apito do árbitro. Considera-se concluído quando a bola cruza
    a linha de área de gol.
  criterios_delimitacao:
    inclusao:
    - Lançamento executado pelo goleiro de dentro de sua área para além da linha de
      6 metros sem apito de autorização
    exclusao:
    - Tiro livre executado pelo goleiro fora de sua área
  estado_de_verificacao: SUSTENTADO_INTEGRALMENTE
  regras:
  - R016
  relacoes:
  - tipo: executado_por
    destino_id: C017
    justificativa: Tiro de execução restrita e privativa do goleiro da equipe.
  - tipo: regulado_por
    destino_id: R016
    justificativa: Regra 12 disciplina a execução do tiro de meta de dentro da área.
  exemplos:
  - tipo: REAL
    descricao: Atacante arremessa para fora sobre a linha de fundo; goleiro pega a
      bola e a arremessa para seu armador fora da área sem esperar apito.
  - tipo: CONTRAEXEMPLO_SIMULADO
    descricao: Jogador de linha entra na área de gol para pegar a bola e cobrar o
      tiro de meta (infração de invasão).
